# nginx de la panificadora. Delante está el Caddy del VPS, que pone el HTTPS y
# es el único que publica puertos: aquí solo llega HTTP por la red de Docker.
#
# Mismo esquema que en Hostinger: el frontend en la raíz y el public/ de
# Laravel en /api (por eso las rutas de la API son /api/api/...).

# La IP real del cliente viene de Caddy, que pisa cualquier X-Forwarded-For que
# mande el cliente. Así Laravel ve la IP verdadera en REMOTE_ADDR sin tener que
# confiar en proxies, y el límite de peticiones por IP sigue siendo por cliente.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;

map $http_x_forwarded_proto $https_tras_caddy {
    https   on;
    default "";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # Archivos reales de public/ (imágenes de productos en /api/storage,
    # favicon) y, si no existen, Laravel.
    location ^~ /api/ {
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri @laravel;
    }

    location @laravel {
        include fastcgi_params;
        # Por variable, nginx resuelve `app` con el DNS de Docker en cada
        # petición: si `app` se recrea con otra IP, no queda apuntando a la vieja.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php app:9000;
        fastcgi_pass $php;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        # Con este SCRIPT_NAME Laravel toma /api como base y ve /api/health en
        # vez de /api/api/health, igual que con el enlace de Hostinger.
        fastcgi_param SCRIPT_NAME /api/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param HTTPS $https_tras_caddy if_not_empty;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        # Las cabeceras de seguridad de la API las pone Laravel (SecurityHeaders).
    }

    # index.html siempre se revalida: tras un despliegue nadie se queda con una
    # versión que apunta a archivos de assets/ que ya no existen.
    location = /index.html {
        include /etc/nginx/cabeceras.conf;
        expires epoch;
    }

    # Los nombres de assets/ llevan hash: cambian con cada build.
    location /assets/ {
        include /etc/nginx/cabeceras.conf;
        expires 1y;
        access_log off;
    }

    # La SPA: cualquier ruta que no sea un archivo (p. ej. /productos) es index.html.
    location / {
        include /etc/nginx/cabeceras.conf;
        try_files $uri $uri/ /index.html;
    }
}
