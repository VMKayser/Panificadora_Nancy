# Cabeceras de seguridad de la tienda (las mismas de frontend/public/.htaccess
# en Hostinger). Van en cada location del frontend porque en nginx un
# add_header dentro de una location anula los del server.
# CSP: scripts solo propios (+ Chart.js del panel admin); estilos inline
# permitidos porque react-toastify y el ticket de impresión los inyectan.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), geolocation=(self)" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-src https://www.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
