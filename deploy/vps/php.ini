; Producción en el VPS. Se suma a los valores por defecto de la imagen oficial.
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 25M
max_execution_time = 60

; El código va dentro de la imagen y no cambia hasta la siguiente: no hace falta
; revisar si los archivos cambiaron en cada petición.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
